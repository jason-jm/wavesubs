# Netlify 从 GitHub 导入时自动读取：站点是纯静态的 docs/，不需要构建
[build]
  publish = "docs"
  command = ""

# GitHub Pages 的子路径链接（/wavesubs/...）贴到自定义域名上也能打开
[[redirects]]
  from = "/wavesubs/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
